server:
  port: 8092         # ✅ Clear high port assignment for Social Service

spring:
  application:
    name: SOCIAL-SERVICE
  main:
    allow-bean-definition-overriding: true

  # ========================================================
  # 🐘 LIVE PERSISTENT STORAGE: POSTGRESQL LAYER
  # ========================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/ghost_social?createDatabaseIfNotExist=true
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: root       # ⚠️ Double-check this string matches your PostgreSQL password!

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ========================================================
  # 📥 LIVE DISTRIBUTED MEMORY STORAGE: DESKTOP REDIS MATRIX
  # ========================================================
  data:
    redis:
      host: 127.0.0.1    # ✅ Forces explicit loopback binding instead of local resolution
      port: 6379         # ⚠️ CHANGE THIS to match the exact port shown inside your Desktop App!
      timeout: 5000ms    # Extends the safety connection buffer threshold window

  # ========================================================
  # 🤖 BACKGROUND ANALYSIS PIPELINE EXCLUSIONS
  # ========================================================
  ai:
    openai:
      enabled: false
    ollama:
      enabled: false

# ========================================================
# 🗺️ SERVICE REGISTRY MAPPING ENGINE (EUREKA)
# ========================================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5