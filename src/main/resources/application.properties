# ========================================================
# ? SERVER & NETWORK LAYOUT
# ========================================================


# ========================================================
# ? CORE DATABASE STORAGE CONFIGURATION (JPA/MYSQL)
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ghost_social?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.show-sql=false

# ========================================================
# ?? SERVICE REGISTRY MAPPING ENGINE (EUREKA)
# ========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5

# ========================================================
# ? PIPELINE FALLBACK BYPASS FILTERS
# ========================================================
spring.ai.openai.enabled=false
spring.ai.ollama.enabled=false
spring.ai.google.genai=false

# ? Max File Size Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB