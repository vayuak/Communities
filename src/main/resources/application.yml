server:
  port: 8092

spring:
  application:
    name: SOCIAL-SERVICE
  main:
    allow-bean-definition-overriding: true

  # ========================================================
  # 🐘 LIVE PERSISTENT STORAGE: POSTGRESQL LAYER (RAILWAY READY)
  # ========================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ========================================================
  # 📥 LIVE DISTRIBUTED MEMORY STORAGE: REDIS (RAILWAY READY)
  # ========================================================
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      timeout: 5000ms

  # ========================================================
  # 📁 FILE STORAGE MAXIMUM BOUNDS
  # ========================================================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ========================================================
  # 🤖 BACKGROUND ANALYSIS PIPELINE EXCLUSIONS
  # ========================================================
  ai:
    openai:
      enabled: false
    ollama:
      enabled: false

# ========================================================
# 🛡️ SECURITY TOKENS (PREVENTS STARTUP CRASHES)
# ========================================================
ghost:
  shield:
    jwt-secret: ${JWT_SECRET}

# ========================================================
# 🗺️ SERVICE REGISTRY MAPPING ENGINE (EUREKA)
# ========================================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5